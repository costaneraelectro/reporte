<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#aad503">
<title>Reporte Electro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0f1210; --bg2:#151a13; --card:#1a2016; --card2:#212a1b; --line:#2c3626;
    --text:#eef2e8; --muted:#a7b39a; --muted2:#717d64;
    --accent:#aad503; --on-accent:#151a08;
    --input:#0d120b;
    --ok:#4ade80; --okbg:#12240f; --warn:#facc15; --warnbg:#2a2408; --bad:#f87171; --badbg:#2a1210;
    --radius:16px; --shadow:0 10px 28px rgba(0,0,0,.35);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + var(--safe-b));transition:background .2s,color .2s}
  a{color:var(--accent)}
  .app{max-width:780px;margin:0 auto;padding:14px 15px 0}
  .hidden{display:none!important}

  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
    padding:11px 15px;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;font-size:16px}
  .brand img{width:34px;height:34px;border-radius:9px;box-shadow:var(--shadow)}
  .brand small{display:block;color:var(--muted2);font-weight:700;font-size:10.5px;letter-spacing:.4px}
  .spacer{flex:1}
  .pill{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);
    padding:6px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
  .dot.online{background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);
    width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer;display:grid;place-items:center}
  .icon-btn:hover{border-color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:17px;margin:13px 0;box-shadow:var(--shadow)}
  .card h2{margin:0 0 3px;font-size:17px}
  .card h3{margin:16px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  .muted{color:var(--muted)} .tiny{font-size:12px;color:var(--muted2)} .center{text-align:center}
  hr.hr{height:1px;background:var(--line);border:0;margin:15px 0}

  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:600}
  input,select,textarea{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);
    padding:12px 13px;border-radius:11px;font-size:16px;outline:none;transition:border .15s}
  input:focus,select:focus{border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}
  .row{display:flex;gap:10px}.row>*{flex:1}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);
    color:var(--on-accent);border:none;padding:13px 15px;border-radius:12px;font-size:15px;font-weight:800;
    cursor:pointer;width:100%;transition:transform .05s,filter .15s}
  .btn:active{transform:scale(.985)} .btn:hover{filter:brightness(1.06)}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.dark{background:#1c2116;color:#eef2e8;border:1px solid var(--line)}
  .btn.danger{background:var(--bad);color:#2a0e0e}
  .btn.sm{width:auto;padding:9px 12px;font-size:13px;border-radius:10px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn-row{display:flex;gap:10px;margin-top:13px}.btn-row .btn{width:auto;flex:1}

  .seg{display:flex;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);padding:10px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer}
  .seg button.active{background:var(--accent);color:var(--on-accent)}

  .chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;
    background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .chip.ok{background:var(--okbg);border-color:#1f5a33;color:var(--ok)}
  .chip.warn{background:var(--warnbg);border-color:#5a4a0a;color:var(--warn)}
  .chip.bad{background:var(--badbg);border-color:#6a2226;color:var(--bad)}
  .chip.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--accent)}

  .rep-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:13px;background:var(--input)}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--card2);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr.area-row td{background:color-mix(in srgb,var(--accent) 12%,var(--card));font-weight:800}
  tbody tr.total td{background:var(--card2);font-weight:800}
  tbody tr.asesor td:first-child{padding-left:22px;color:var(--muted)}

  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi .k{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .k .n{font-size:20px;font-weight:900}
  .kpi .k .l{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px}

  .semaforo{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  .semaforo.ok{background:var(--ok)}.semaforo.warn{background:var(--warn)}.semaforo.bad{background:var(--bad)}
  .pctok{color:var(--ok)}.pctwarn{color:var(--warn)}.pctbad{color:var(--bad)}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px calc(8px + var(--safe-b));
    display:flex;justify-content:space-around}
  .nav button{background:none;border:none;color:var(--muted2);font-size:11px;font-weight:800;display:flex;
    flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer;flex:1;border-radius:10px}
  .nav button .ic{font-size:20px;line-height:1}
  .nav button.active{color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);
    background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;
    box-shadow:var(--shadow);z-index:120;max-width:90%;text-align:center;font-size:14px}
  .modal-bg{position:fixed;inset:0;background:rgba(3,7,4,.72);z-index:90;display:grid;place-items:center;padding:14px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;
    max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
  .modal .m-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal .m-body{padding:17px}

  .list-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--input)}
  .list-item .li-main{flex:1;min-width:0}
  .list-item .li-main .t{font-weight:800}
  .list-item .li-main .s{font-size:12px;color:var(--muted)}

  .ocr-note{font-size:12px;color:var(--warn);background:var(--warnbg);border:1px solid #5a4a0a;padding:8px 10px;border-radius:10px;margin-top:8px}
  .field-flag{border-color:var(--warn)!important}
  .badge-ai{font-size:10px;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid var(--accent);color:var(--accent);padding:2px 7px;border-radius:999px;margin-left:6px}
  .swatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .swatch.sel{border-color:var(--text)}

  /* Fullscreen report (fondo blanco) */
  .fs{position:fixed;inset:0;background:#fff;color:#111;z-index:200;overflow:auto;padding:18px}
  .fs .fs-close{position:fixed;top:12px;right:12px;background:#111;color:#fff;border:none;width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;z-index:210}
  .fs h1{font-size:22px;margin:4px 0 2px;text-align:center}
  .fs .fs-date{text-align:center;color:#555;margin-bottom:14px;text-transform:capitalize}
  .fs table{background:#fff;color:#111;border:1px solid #ddd;table-layout:fixed}
  .fs th,.fs td{border-bottom:1px solid #e5e5e5;padding:8px 7px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
  .fs th:first-child,.fs td:first-child{width:34%}
  .fs thead th{background:#f3f6ea;color:#333}
  .fs tr.area-row td{background:#eaf3c6;color:#1a1f14}
  .fs tr.total td{background:#111;color:#fff;font-weight:900}
  .fs .fs-foot{text-align:center;color:#888;font-size:12px;margin-top:14px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><img src="icon-180.png" alt="RE"><div>Reporte Electro<small id="tbSub">Garantía · Seguro</small></div></div>
  <div class="spacer"></div>
  <span class="pill" id="modePill"><span class="dot" id="modeDot"></span><span id="modeText">local</span></span>
  <button class="icon-btn" id="btnTheme" title="Claro/oscuro">🌙</button>
  <button class="icon-btn" id="btnLogout" title="Cerrar sesión">⎋</button>
</div>

<div class="app" id="app"></div>

<nav class="nav" id="nav">
  <button data-view="registrar" class="active"><span class="ic">➕</span>Registrar</button>
  <button data-view="reporte"><span class="ic">📊</span>Reporte</button>
  <button data-view="avance"><span class="ic">📈</span>Avance</button>
  <button data-view="config"><span class="ic">⚙️</span>Config</button>
</nav>

<script>
/* =========================================================================
   REPORTE ELECTRO v3
   ========================================================================= */

/* --- Pega aquí tu Firebase UNA sola vez para que quede en línea siempre --- */
const FIREBASE_CONFIG = {
  apiKey:"", authDomain:"", projectId:"", storageBucket:"", messagingSenderId:"", appId:""
};

/* --- Dominio --- */
const AREAS_DEPTOS = {
  "ELECTRO NEGRO":["AUDIO","CONNECT","VIDEOJUEGOS","COMPUTACION"],
  "LINEA BLANCA":["ELECTRODOMESTICOS","CUIDADO PERSONAL","LINEA BLANCA","OTROS"]
};
const AREAS = Object.keys(AREAS_DEPTOS);
const NOMIX_DEPTOS = ["VIDEO","AUDIO","COMPUTACION Y HOGAR","TELEFONIA","ELECTRODOMESTICOS","LINEA BLANCA","DECO",
  "ZAPATOS HOMBRE","ZAPATOS MUJER","ZAPATILLAS HOMBRE","ZAPATILLAS MUJER","CALZADO COLEGIAL","ZAPATOS INFANTIL"];
const THEME_PRESETS = {"Lima":"#aad503","Azul":"#3b82f6","Cian":"#06b6d4","Violeta":"#8b5cf6","Naranjo":"#f97316","Rojo":"#ef4444","Rosa":"#ec4899"};
const ADMIN_PASS = "connect2025";

function metasSeed(){
  const m={}; for(const a of AREAS) for(const d of AREAS_DEPTOS[a]) m[a+"::"+d]={garantia:0,seguro:0}; return m;
}
const DEFAULT_CONFIG = {
  mes:{inicio:"",fin:""},
  metas:metasSeed(),
  theme:{accent:"#aad503"},
  gemini:{apiKey:"",model:"gemini-2.0-flash"},
  firebase:{apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""}
};

/* --- utils --- */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const clean=s=>(s||"").toString().trim();
const norm=s=>clean(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const CLP=n=>"$"+Math.round(+n||0).toLocaleString("es-CL");
const num=v=>Math.round(+String(v).replace(/[^\d]/g,""))||0;
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function fechaLarga(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function toast(m,ms=2600){let t=$(".toast");if(t)t.remove();t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function estado(p){return p>=100?"ok":p>=80?"warn":"bad";}
function diffDays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}
function areaDeDepto(d){for(const a of AREAS)if(AREAS_DEPTOS[a].includes(d))return a;return "";}

/* --- Tema --- */
const PAL={
  dark:{"--bg":"#0f1210","--bg2":"#151a13","--card":"#1a2016","--card2":"#212a1b","--line":"#2c3626","--text":"#eef2e8","--muted":"#a7b39a","--muted2":"#717d64","--input":"#0d120b"},
  light:{"--bg":"#f4f6f0","--bg2":"#eef1e8","--card":"#ffffff","--card2":"#f5f8ef","--line":"#dde3d2","--text":"#1a1f14","--muted":"#5c6650","--muted2":"#8a927c","--input":"#f7f9f2"}
};
function lum(hex){const c=hex.replace("#","");const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return (0.299*r+0.587*g+0.114*b)/255;}
function applyTheme(){
  const mode=localStorage.getItem("re_mode")||"dark";
  const accent=(Store.config&&Store.config.theme&&Store.config.theme.accent)||"#aad503";
  const r=document.documentElement.style, pal=PAL[mode];
  for(const k in pal) r.setProperty(k,pal[k]);
  r.setProperty("--accent",accent);
  r.setProperty("--on-accent", lum(accent)>0.6?"#151a08":"#ffffff");
  const bt=$("#btnTheme"); if(bt) bt.textContent=mode==="dark"?"🌙":"☀️";
  const meta=document.querySelector('meta[name=theme-color]'); if(meta)meta.setAttribute("content",pal["--bg"]);
}
function toggleTheme(){localStorage.setItem("re_mode",(localStorage.getItem("re_mode")||"dark")==="dark"?"light":"dark");applyTheme();}

/* =========================================================================
   Store (Firebase o local)
   ========================================================================= */
const Store={
  mode:"local",db:null,auth:null,storage:null,user:null,config:null,
  onVentas:null,ventasCache:[],onAvances:null,avancesCache:[],onUsers:null,usersCache:[],
  lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  lsSet(k,v){localStorage.setItem(k,JSON.stringify(v))},

  loadLocalConfig(){
    const c=this.lsGet("re3_config",null);
    this.config=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)),c||{});
    this.config.metas=Object.assign(metasSeed(),this.config.metas||{});
    this.config.gemini=Object.assign({},DEFAULT_CONFIG.gemini,this.config.gemini||{});
    this.config.firebase=Object.assign({},DEFAULT_CONFIG.firebase,this.config.firebase||{});
    this.config.theme=Object.assign({accent:"#aad503"},this.config.theme||{});
    this.config.mes=Object.assign({inicio:"",fin:""},this.config.mes||{});
    return this.config;
  },
  async saveConfig(c){this.config=c;this.lsSet("re3_config",c);
    if(this.mode==="firebase"){try{await this.db.collection("config").doc("app").set(c,{merge:true});}catch(e){console.warn(e);toast("No se pudo guardar en línea (¿eres admin?)");}}},

  async init(){
    this.loadLocalConfig();
    const fc=(FIREBASE_CONFIG.apiKey?FIREBASE_CONFIG:this.config.firebase);
    if(fc&&fc.apiKey&&fc.projectId){
      try{await this.initFirebase(fc);this.mode="firebase";return;}catch(e){console.warn("Firebase:",e);toast("Firebase no conectó, modo local");}
    }
    this.mode="local";
  },
  loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});},
  async initFirebase(fc){
    if(!window.firebase){const b="https://www.gstatic.com/firebasejs/10.14.1/";
      for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js","firebase-storage-compat.js"])await this.loadScript(b+f);}
    if(!firebase.apps.length)firebase.initializeApp(fc);
    this.db=firebase.firestore();this.auth=firebase.auth();try{this.storage=firebase.storage();}catch{this.storage=null;}
    try{const d=await this.db.collection("config").doc("app").get();
      if(d.exists){this.config=Object.assign(this.config,d.data());this.config.metas=Object.assign(metasSeed(),this.config.metas||{});this.lsSet("re3_config",this.config);}}catch(e){console.warn(e);}
  },

  emailFor(username){return username+"@reporteelectro.app";},
  usernameOf(nombre,apellido){return (norm(nombre)+"."+norm(apellido)).replace(/[^a-z0-9.]/g,"").replace(/\.+/g,".");},

  async countUsers(){
    if(this.mode==="firebase"){const s=await this.db.collection("usuarios").limit(1).get();return s.size;}
    return Object.keys(this.lsGet("re3_users",{})).length;
  },
  async signUp({nombre,apellido,codigo,clave}){
    const username=this.usernameOf(nombre,apellido);
    const first=(await this.countUsers())===0;
    const prof={nombre:clean(nombre),apellido:clean(apellido),codigo:clean(codigo),username,
      display:clean(nombre)+" "+clean(apellido),rol:first?"admin":"user",estado:first?"activo":"pendiente",createdAt:Date.now()};
    if(this.mode==="firebase"){
      const cred=await this.auth.createUserWithEmailAndPassword(this.emailFor(username),clave);
      prof.uid=cred.user.uid;
      await this.db.collection("usuarios").doc(cred.user.uid).set(prof);
      if(prof.estado!=="activo"){await this.auth.signOut();} else this.user=prof;
    }else{
      const users=this.lsGet("re3_users",{});
      if(users[username])throw new Error("Ese usuario ya existe.");
      prof.uid="local_"+uid();prof.clave=clave;users[username]=prof;this.lsSet("re3_users",users);
      if(prof.estado==="activo"){this.lsSet("re3_session",prof.uid);this.user=prof;}
    }
    return prof;
  },
  async signIn({username,clave}){
    username=norm(username).replace(/\s+/g,".");
    if(this.mode==="firebase"){
      const cred=await this.auth.signInWithEmailAndPassword(this.emailFor(username),clave);
      const d=await this.db.collection("usuarios").doc(cred.user.uid).get();
      const p=d.exists?d.data():null;
      if(!p||p.estado!=="activo"){await this.auth.signOut();throw new Error("Tu cuenta está pendiente de aprobación por un administrador.");}
      this.user=p;return p;
    }else{
      const users=this.lsGet("re3_users",{});const u=users[username];
      if(!u||u.clave!==clave)throw new Error("Usuario o clave incorrectos.");
      if(u.estado!=="activo")throw new Error("Tu cuenta está pendiente de aprobación por un administrador.");
      this.lsSet("re3_session",u.uid);this.user=u;return u;
    }
  },
  async restoreSession(){
    if(this.mode==="firebase"){return new Promise(res=>{this.auth.onAuthStateChanged(async u=>{
      if(u){const d=await this.db.collection("usuarios").doc(u.uid).get();const p=d.exists?d.data():null;
        this.user=(p&&p.estado==="activo")?p:null; if(p&&p.estado!=="activo")await this.auth.signOut();}
      else this.user=null; res(this.user);});});}
    const sid=this.lsGet("re3_session",null);
    if(sid){const users=this.lsGet("re3_users",{});this.user=Object.values(users).find(u=>u.uid===sid)||null;}
    return this.user;
  },
  async signOut(){if(this.mode==="firebase")await this.auth.signOut();else localStorage.removeItem("re3_session");this.user=null;},
  isAdmin(){return this.user&&this.user.rol==="admin";},

  /* usuarios (admin) */
  subscribeUsers(cb){this.onUsers=cb;
    if(this.mode==="firebase"){this.db.collection("usuarios").onSnapshot(s=>{this.usersCache=s.docs.map(d=>Object.assign({uid:d.id},d.data()));cb(this.usersCache);},e=>console.warn(e));}
    else{this._emitUsers();}},
  _emitUsers(){this.usersCache=Object.values(this.lsGet("re3_users",{}));if(this.onUsers)this.onUsers(this.usersCache);},
  async setUser(uid2,patch){
    if(this.mode==="firebase"){await this.db.collection("usuarios").doc(uid2).update(patch);}
    else{const users=this.lsGet("re3_users",{});const k=Object.keys(users).find(x=>users[x].uid===uid2);if(k){Object.assign(users[k],patch);this.lsSet("re3_users",users);this._emitUsers();}}
    if(this.user&&this.user.uid===uid2)Object.assign(this.user,patch);
  },
  async claimAdmin(){await this.setUser(this.user.uid,{rol:"admin",estado:"activo"});},

  /* ventas */
  async addVenta(v){v.registradoPor=this.user.uid;v.registradoPorNombre=this.user.display||"";v.ts=Date.now();
    if(this.mode==="firebase"){const r=await this.db.collection("ventas").add(v);v.id=r.id;}
    else{v.id=uid();const a=this.lsGet("re3_ventas",[]);a.push(v);this.lsSet("re3_ventas",a);this._emitV();}return v;},
  subscribeVentas(cb){this.onVentas=cb;
    if(this.mode==="firebase"){this.db.collection("ventas").orderBy("ts","desc").onSnapshot(s=>{this.ventasCache=s.docs.map(d=>Object.assign({id:d.id},d.data()));cb(this.ventasCache);},e=>console.warn(e));}
    else{this._emitV();}},
  _emitV(){this.ventasCache=this.lsGet("re3_ventas",[]).sort((a,b)=>b.ts-a.ts);if(this.onVentas)this.onVentas(this.ventasCache);},

  /* avances (admin) */
  async addAvance(a){a.importadoPor=this.user.uid;a.ts=Date.now();
    if(this.mode==="firebase"){const r=await this.db.collection("avances").add(a);a.id=r.id;}
    else{a.id=uid();const arr=this.lsGet("re3_avances",[]);arr.push(a);this.lsSet("re3_avances",arr);this._emitA();}return a;},
  async deleteAvance(id){if(this.mode==="firebase"){await this.db.collection("avances").doc(id).delete();}
    else{const arr=this.lsGet("re3_avances",[]).filter(x=>x.id!==id);this.lsSet("re3_avances",arr);this._emitA();}},
  subscribeAvances(cb){this.onAvances=cb;
    if(this.mode==="firebase"){this.db.collection("avances").orderBy("ts","desc").onSnapshot(s=>{this.avancesCache=s.docs.map(d=>Object.assign({id:d.id},d.data()));cb(this.avancesCache);},e=>console.warn(e));}
    else{this._emitA();}},
  _emitA(){this.avancesCache=this.lsGet("re3_avances",[]).sort((a,b)=>b.ts-a.ts);if(this.onAvances)this.onAvances(this.avancesCache);},

  async uploadBoleta(file){if(this.mode==="firebase"&&this.storage){const p=`boletas/${this.user.uid}/${Date.now()}_${(file.name||"b").slice(-40)}`;const r=this.storage.ref().child(p);await r.put(file);return await r.getDownloadURL();}return null;}
};

/* =========================================================================
   IA (Gemini)
   ========================================================================= */
function fileToB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});}
async function geminiCall(parts){
  const g=Store.config.gemini;if(!g.apiKey)throw new Error("Falta la API key de Gemini (⚙️ Config).");
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${g.model||"gemini-2.0-flash"}:generateContent?key=${encodeURIComponent(g.apiKey)}`;
  const body={contents:[{parts}],generationConfig:{temperature:0.1,response_mime_type:"application/json"}};
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("Gemini "+r.status+": "+(await r.text()).slice(0,160));
  const j=await r.json();const t=j?.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
  try{return JSON.parse(t);}catch{const m=t.match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):{};}
}
async function leerBoleta(file){
  const b64=await fileToB64(file);
  const deptTxt=AREAS.map(a=>a+": "+AREAS_DEPTOS[a].join(", ")).join(" | ");
  const prompt=`Lees una BOLETA de Falabella (Chile), imagen o PDF. Extrae SOLO lo que veas. Devuelve EXCLUSIVAMENTE JSON:
{"vendedor_nombre":string|null,"vendedor_codigo":string|null,"producto":string|null,"monto":number|null,
"valor_garantia":number|null,"tipo":"Garantía"|"Seguro"|null,"area":string|null,"departamento":string|null,
"confianza":number,"dudas":[string]}
El vendedor suele venir como "VENDEDOR:<codigo> <APELLIDO>". Montos como enteros en pesos (sin puntos ni símbolos).
Según el producto, sugiere area y departamento de esta lista: ${deptTxt}. Si no puedes, deja null y agrégalo a "dudas".`;
  return await geminiCall([{text:prompt},{inline_data:{mime_type:file.type||"image/jpeg",data:b64}}]);
}
function htmlATexto(s){return s.replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<script[\s\S]*?<\/script>/gi,"")
  .replace(/<\/(tr|div|p|table)>/gi,"\n").replace(/<\/t[dh]>/gi," | ").replace(/<[^>]+>/g," ")
  .replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/[ \t]+/g," ").replace(/\n{2,}/g,"\n").trim();}
async function leerAvanceLooker(text){
  const prompt=`Recibes un reporte exportado de Looker (texto/tabla) con AVANCES de venta por DEPARTAMENTO y/o ASESOR,
para garantía extendida (GEXT) y seguro (Seguro Connect), de una tienda de electrohogar en Chile.
Devuelve EXCLUSIVAMENTE JSON: {"filas":[{"nivel":"departamento"|"asesor","nombre":string,"area":string|null,"departamento":string|null,"gext":number,"seguro":number}],"dudas":[string]}
Áreas: "ELECTRO NEGRO" o "LINEA BLANCA". No incluyas filas de totales generales. Montos enteros en pesos. Contenido:
"""${text.slice(0,120000)}"""`;
  return await geminiCall([{text:prompt}]);
}

/* ---------------- helpers de agregación ---------------- */
function aggVentasDia(fecha){
  const A={};for(const a of AREAS){A[a]={depts:{}};for(const d of AREAS_DEPTOS[a])A[a].depts[d]={gar:0,seg:0,ases:{}};}
  Store.ventasCache.forEach(v=>{if(v.fecha!==fecha)return;const cat=v.categoria;if(cat!=="GEXT"&&cat!=="SEGURO")return;
    const a=v.area,d=v.departamento;if(!A[a]||!A[a].depts[d])return;
    const cell=A[a].depts[d];const nm=v.asesorNombre||"(s/n)";
    cell.ases[nm]=cell.ases[nm]||{gar:0,seg:0};
    if(cat==="GEXT"){cell.gar+=+v.monto||0;cell.ases[nm].gar+=+v.monto||0;}else{cell.seg+=+v.monto||0;cell.ases[nm].seg+=+v.monto||0;}});
  return A;
}
function metaDept(area,depto){const m=Store.config.metas[area+"::"+depto]||{garantia:0,seguro:0};return {gar:+m.garantia||0,seg:+m.seguro||0};}
function mesInfo(){const m=Store.config.mes||{};if(!m.inicio||!m.fin)return null;
  const diasTot=diffDays(m.inicio,m.fin)+1;const hoy=todayStr();
  const ref=hoy<m.inicio?m.inicio:(hoy>m.fin?m.fin:hoy);
  const diasRest=Math.max(1,diffDays(ref,m.fin)+1);
  return {inicio:m.inicio,fin:m.fin,diasTot,diasRest,diasTrans:diasTot-diasRest+1};}

/* ---------------- REPORTE (día, por área/depto) ---------------- */
let repDate=todayStr();
function renderReporte(app){
  const A=aggVentasDia(repDate);const mi=mesInfo();
  const diasTot=mi?mi.diasTot:30;
  let tGar=0,tSeg=0,tMetaDia=0;
  let rows="";
  for(const area of AREAS){
    rows+=`<tr class="area-row"><td>${area}</td><td>Garantía</td><td>Seguro</td><td>Total</td><td>Cumpl.</td></tr>`;
    for(const d of AREAS_DEPTOS[area]){
      const c=A[area].depts[d];const tot=c.gar+c.seg;
      const meta=metaDept(area,d);const metaDia=(meta.gar+meta.seg)/diasTot;
      const pct=metaDia?Math.round(tot/metaDia*1000)/10:0;const es=estado(pct);
      tGar+=c.gar;tSeg+=c.seg;tMetaDia+=metaDia;
      rows+=`<tr><td><b>${d}</b></td><td>${CLP(c.gar)}</td><td>${CLP(c.seg)}</td><td><b>${CLP(tot)}</b></td>
        <td class="pct${es}">${metaDia?pct+'%':'—'}</td></tr>`;
    }
  }
  const tot=tGar+tSeg;const pctT=tMetaDia?Math.round(tot/tMetaDia*1000)/10:0;const esT=estado(pctT);
  const falta=Math.max(0,Math.round(tMetaDia-tot));
  const kpis=`<div class="kpi">
    <div class="k"><div class="l">Garantía hoy</div><div class="n">${CLP(tGar)}</div></div>
    <div class="k"><div class="l">Seguro hoy</div><div class="n">${CLP(tSeg)}</div></div>
    <div class="k"><div class="l">Total hoy</div><div class="n">${CLP(tot)}</div></div>
    <div class="k"><div class="l">Cumpl. meta diaria</div><div class="n pct${esT}">${tMetaDia?pctT+'%':'—'}</div></div>
  </div>`;

  // detalle por asesor (por departamento)
  let det="";
  for(const area of AREAS)for(const d of AREAS_DEPTOS[area]){
    const c=A[area].depts[d];const names=Object.keys(c.ases);if(!names.length)continue;
    det+=`<tr class="area-row"><td>${area} · ${d}</td><td>Garantía</td><td>Seguro</td><td>Total</td></tr>`;
    names.forEach(nm=>{const x=c.ases[nm];det+=`<tr class="asesor"><td>${esc(nm)}</td><td>${CLP(x.gar)}</td><td>${CLP(x.seg)}</td><td>${CLP(x.gar+x.seg)}</td></tr>`;});
  }
  if(!det)det=`<tr><td colspan="4" class="center muted" style="padding:18px">Sin ventas registradas hoy</td></tr>`;

  app.innerHTML=`
  <div class="card">
    <div class="row" style="align-items:center">
      <div style="flex:1"><input type="date" id="repDate" value="${repDate}"></div>
      <button class="btn sm" id="btnFull" style="flex:none">🖥️ Reporte</button>
    </div>
    ${kpis}
    ${falta>0?`<p class="tiny" style="margin-top:8px">Falta <b style="color:var(--warn)">${CLP(falta)}</b> para llegar a la meta diaria de hoy.</p>`:(tMetaDia?`<p class="tiny" style="margin-top:8px">✅ Meta diaria cumplida.</p>`:`<p class="tiny" style="margin-top:8px">Define metas y mes comercial en ⚙️ Config para ver el cumplimiento.</p>`)}
  </div>
  <div class="card">
    <h2>Avance del día por área · departamento</h2>
    <div class="rep-wrap" style="margin-top:10px"><table>
      <thead><tr><th>Área / Depto</th><th>Garantía</th><th>Seguro</th><th>Total</th><th>Cumpl.</th></tr></thead>
      <tbody>${rows}
        <tr class="total"><td>TOTAL TIENDA</td><td>${CLP(tGar)}</td><td>${CLP(tSeg)}</td><td>${CLP(tot)}</td><td class="pct${esT}">${tMetaDia?pctT+'%':'—'}</td></tr>
        ${falta>0?`<tr class="total"><td>Falta para meta diaria</td><td></td><td></td><td colspan="2">${CLP(falta)}</td></tr>`:''}
      </tbody></table></div>
  </div>
  <div class="card">
    <h2>Detalle por asesor</h2>
    <div class="rep-wrap" style="margin-top:10px"><table>
      <thead><tr><th>Depto / Asesor</th><th>Garantía</th><th>Seguro</th><th>Total</th></tr></thead>
      <tbody>${det}</tbody></table></div>
  </div>`;
  $("#repDate").onchange=e=>{repDate=e.target.value;renderReporte(app);};
  $("#btnFull").onclick=()=>reporteFull(A,tGar,tSeg,tot,pctT,esT,falta,tMetaDia);
}
function reporteFull(A,tGar,tSeg,tot,pctT,esT,falta,tMetaDia){
  let rows="";
  for(const area of AREAS){
    rows+=`<tr class="area-row"><td>${area}</td><td>Garantía</td><td>Seguro</td><td>Total</td></tr>`;
    for(const d of AREAS_DEPTOS[area]){const c=A[area].depts[d];rows+=`<tr><td><b>${d}</b></td><td>${CLP(c.gar)}</td><td>${CLP(c.seg)}</td><td><b>${CLP(c.gar+c.seg)}</b></td></tr>`;}
  }
  const html=`<div class="fs" id="fs"><button class="fs-close" id="fsX">✕</button>
    <h1>Reporte Electro</h1><div class="fs-date">${fechaLarga(repDate)}</div>
    <table><thead><tr><th>Área / Depto</th><th>Garantía</th><th>Seguro</th><th>Total</th></tr></thead>
    <tbody>${rows}
      <tr class="total"><td>TOTAL TIENDA</td><td>${CLP(tGar)}</td><td>${CLP(tSeg)}</td><td>${CLP(tot)}</td></tr>
      ${tMetaDia?`<tr class="total"><td>Cumplimiento meta diaria</td><td colspan="3">${pctT}%${falta>0?' · falta '+CLP(falta):' · ✅'}</td></tr>`:''}
    </tbody></table>
    <div class="fs-foot">Toma la captura de esta pantalla para enviar el reporte.</div></div>`;
  document.body.insertAdjacentHTML("beforeend",html);
  $("#fsX").onclick=()=>$("#fs").remove();
}

/* ---------------- AVANCE (desde Looker) ---------------- */
function areaAggAvance(av){
  const A={};for(const a of AREAS){A[a]={depts:{},ases:{}};for(const d of AREAS_DEPTOS[a])A[a].depts[d]={gar:0,seg:0};}
  (av?.filas||[]).forEach(f=>{
    const dep=(f.departamento||(f.nivel==='departamento'?f.nombre:"")||"").toUpperCase();
    let area=(f.area||"").toUpperCase();if(!AREAS.includes(area))area=areaDeDepto(dep)||AREAS[0];
    const g=+f.gext||0,s=+f.seguro||0;
    if(f.nivel==='asesor'){const nm=f.nombre||"(s/n)";A[area].ases[nm]=A[area].ases[nm]||{gar:0,seg:0,dep};A[area].ases[nm].gar+=g;A[area].ases[nm].seg+=s;}
    if(A[area].depts[dep]){A[area].depts[dep].gar+=g;A[area].depts[dep].seg+=s;}
  });
  // si sólo vinieron asesores, sumar sus montos al depto
  for(const a of AREAS){const anyDept=Object.values(A[a].depts).some(x=>x.gar||x.seg);
    if(!anyDept){for(const nm in A[a].ases){const x=A[a].ases[nm];if(A[a].depts[x.dep]){A[a].depts[x.dep].gar+=x.gar;A[a].depts[x.dep].seg+=x.seg;}}}}
  return A;
}
function renderAvance(app){
  const av=Store.avancesCache[0]||null;const mi=mesInfo();
  if(!av){app.innerHTML=`<div class="card"><h2>Avance</h2><p class="sub">Aún no hay avances cargados. Un administrador los sube en ⚙️ Config (archivo HTML/TXT de Looker).</p></div>`;return;}
  const A=areaAggAvance(av);
  const diasRest=mi?mi.diasRest:1;
  let rows="",asesRows="";let TG=0,TS=0,TMg=0,TMs=0;
  for(const area of AREAS){
    rows+=`<tr class="area-row"><td>${area}</td><td>Gtía</td><td>Seguro</td><td>Meta</td><td>M.diaria</td><td>Falta</td></tr>`;
    for(const d of AREAS_DEPTOS[area]){
      const c=A[area].depts[d];const av2=c.gar+c.seg;const meta=metaDept(area,d);const metaTot=meta.gar+meta.seg;
      const falta=Math.max(0,metaTot-av2);const md=Math.round(falta/diasRest);
      TG+=c.gar;TS+=c.seg;TMg+=meta.gar;TMs+=meta.seg;
      rows+=`<tr><td><b>${d}</b></td><td>${CLP(c.gar)}</td><td>${CLP(c.seg)}</td><td>${CLP(metaTot)}</td><td><b>${CLP(md)}</b></td><td>${CLP(falta)}</td></tr>`;
    }
    // asesores del área
    const names=Object.keys(A[area].ases);
    if(names.length){asesRows+=`<tr class="area-row"><td>${area}</td><td>Garantía</td><td>Seguro</td><td>Total</td></tr>`;
      names.forEach(nm=>{const x=A[area].ases[nm];asesRows+=`<tr class="asesor"><td>${esc(nm)}</td><td>${CLP(x.gar)}</td><td>${CLP(x.seg)}</td><td>${CLP(x.gar+x.seg)}</td></tr>`;});}
  }
  const avT=TG+TS,metaT=TMg+TMs,faltaT=Math.max(0,metaT-avT),mdT=Math.round(faltaT/diasRest);
  app.innerHTML=`
  <div class="card">
    <div class="row" style="align-items:center"><h2 style="flex:1">Avance del mes</h2>
      <span class="chip acc">${mi?mi.diasRest+' días restantes':'define mes en config'}</span></div>
    <p class="sub">Fuente: avance Looker del ${esc(av.fecha||'')}. ${mi?`Mes ${esc(mi.inicio)} → ${esc(mi.fin)}.`:''}</p>
    <div class="kpi">
      <div class="k"><div class="l">Garantía mes</div><div class="n">${CLP(TG)}</div></div>
      <div class="k"><div class="l">Seguro mes</div><div class="n">${CLP(TS)}</div></div>
      <div class="k"><div class="l">Falta para meta</div><div class="n">${CLP(faltaT)}</div></div>
      <div class="k"><div class="l">Meta diaria</div><div class="n">${CLP(mdT)}</div></div>
    </div>
  </div>
  <div class="card"><h2>Por área · departamento</h2>
    <div class="rep-wrap" style="margin-top:10px"><table>
      <thead><tr><th>Área / Depto</th><th>Gtía</th><th>Seguro</th><th>Meta</th><th>M.diaria</th><th>Falta</th></tr></thead>
      <tbody>${rows}
        <tr class="total"><td>TOTAL TIENDA</td><td>${CLP(TG)}</td><td>${CLP(TS)}</td><td>${CLP(metaT)}</td><td>${CLP(mdT)}</td><td>${CLP(faltaT)}</td></tr>
      </tbody></table></div>
  </div>
  <div class="card"><h2>Venta por asesor</h2>
    <div class="rep-wrap" style="margin-top:10px"><table>
      <thead><tr><th>Área / Asesor</th><th>Garantía</th><th>Seguro</th><th>Total</th></tr></thead>
      <tbody>${asesRows||`<tr><td colspan="4" class="center muted" style="padding:16px">El avance no trae desglose por asesor</td></tr>`}</tbody></table></div>
  </div>`;
}

/* ---------------- CONFIG ---------------- */
function renderConfig(app){
  const c=Store.config;const admin=Store.isAdmin();
  // apariencia (todos)
  const mode=localStorage.getItem("re_mode")||"dark";
  let html=`<div class="card"><h2>Apariencia</h2>
    <div class="seg" style="margin-top:8px"><button id="mDark" class="${mode==='dark'?'active':''}">🌙 Oscuro</button><button id="mLight" class="${mode==='light'?'active':''}">☀️ Claro</button></div>
    <h3>Color de la app</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${Object.entries(THEME_PRESETS).map(([n,hex])=>`<div class="swatch ${c.theme.accent===hex?'sel':''}" data-hex="${hex}" title="${n}" style="background:${hex}"></div>`).join("")}</div>
    <label style="margin-top:12px">Color personalizado</label><input type="color" id="cAccent" value="${c.theme.accent}" style="height:44px;padding:4px">
    ${admin?'':'<p class="tiny" style="margin-top:10px">Cambiar el color afecta a todos (guardado por admin). Tú sí puedes cambiar claro/oscuro.</p>'}
  </div>`;

  if(!admin){
    html+=`<div class="card"><h2>Administración</h2>
      <p class="sub">Necesitas cuenta de administrador para metas, usuarios y avances.</p>
      <label>Clave de administrador</label><input id="claimPass" type="password" placeholder="••••••••">
      <div class="btn-row"><button class="btn" id="claimBtn">Convertirme en administrador</button></div>
      <p class="tiny">Un admin también puede promover tu cuenta desde Usuarios.</p></div>`;
    app.innerHTML=html;bindApariencia(c);
    $("#claimBtn").onclick=async()=>{if($("#claimPass").value!==ADMIN_PASS)return toast("Clave incorrecta");
      await Store.claimAdmin();toast("Ahora eres administrador");renderConfig(app);};
    return;
  }

  const mi=mesInfo();
  html+=`
  <div class="card"><h2>Mes comercial</h2>
    <div class="grid2">
      <div><label>Inicio</label><input id="cMesIni" type="date" value="${esc(c.mes.inicio||'')}"></div>
      <div><label>Término</label><input id="cMesFin" type="date" value="${esc(c.mes.fin||'')}"></div>
    </div>
    ${mi?`<p class="tiny" style="margin-top:8px">Quedan <b style="color:var(--accent)">${mi.diasRest}</b> día(s) para que termine el mes (van ${mi.diasTrans}/${mi.diasTot}).</p>`:''}
  </div>

  <div class="card"><h2>Metas por departamento</h2>
    <p class="sub">Meta mensual de garantía y seguro por departamento.</p>
    <div id="metasBox"></div>
  </div>

  <div class="card"><h2>Usuarios</h2>
    <p class="sub">Aprueba cuentas y designa administradores.</p>
    <div id="usersBox">Cargando…</div>
  </div>

  <div class="card"><h2>Subir avance de Looker</h2>
    <p class="sub">Sube el HTML o TXT descargado de Looker; la IA lo lee y lo verificas antes de guardar.</p>
    <label>Fecha del avance</label><input type="date" id="avFecha" value="${todayStr()}">
    <label class="btn secondary" style="cursor:pointer;margin-top:10px">📄 Elegir archivo (.html/.txt/.csv)<input id="avFile" type="file" accept=".html,.htm,.txt,.csv" class="hidden"></label>
    <div id="avStatus"></div><div id="avTabla"></div>
    <div id="avList" style="margin-top:12px"></div>
  </div>

  <div class="card"><h2>Extracción de boletas (IA · Gemini)</h2>
    <label>API key</label><input id="cGemKey" type="password" value="${esc(c.gemini.apiKey||'')}" placeholder="AIza…">
    <label>Modelo</label><input id="cGemModel" value="${esc(c.gemini.model||'gemini-2.0-flash')}">
    <p class="tiny">Gratis en aistudio.google.com/apikey</p>
  </div>

  <div class="card"><h2>Firebase</h2>
    <p class="tiny">Lo ideal: pega tu config UNA vez en la constante <b>FIREBASE_CONFIG</b> arriba de index.html y súbelo al repo. También puedes pegarlo aquí:</p>
    <label>JSON de firebaseConfig</label><textarea id="fbJson" placeholder='{"apiKey":"…","projectId":"…", …}'></textarea>
  </div>

  <div class="btn-row"><button class="btn" id="cfgSave">Guardar configuración</button></div>`;
  app.innerHTML=html;bindApariencia(c);

  // metas
  function drawMetas(){$("#metasBox").innerHTML=AREAS.map(a=>`
    <h3>${a}</h3>${AREAS_DEPTOS[a].map(d=>{const m=metaDept(a,d);return `
      <div class="row" style="align-items:center;margin-bottom:6px">
        <div style="flex:1.2;font-size:13px;font-weight:700">${d}</div>
        <input data-k="${a}::${d}" data-t="garantia" inputmode="numeric" value="${m.gar}" placeholder="Garantía">
        <input data-k="${a}::${d}" data-t="seguro" inputmode="numeric" value="${m.seg}" placeholder="Seguro">
      </div>`;}).join("")}`).join("");}
  drawMetas();

  // usuarios
  Store.subscribeUsers(list=>{const box=$("#usersBox");if(!box)return;
    const pend=list.filter(u=>u.estado!=="activo"),act=list.filter(u=>u.estado==="activo");
    box.innerHTML=(pend.length?`<h3>Pendientes</h3>`+pend.map(u=>`<div class="list-item"><div class="li-main"><div class="t">${esc(u.display)} <span class="chip warn">pendiente</span></div><div class="s">${esc(u.username)} · N° ${esc(u.codigo||'')}</div></div><button class="btn sm" data-appr="${u.uid}">Aprobar</button></div>`).join(""):'')
      +`<h3>Activos</h3>`+(act.length?act.map(u=>`<div class="list-item"><div class="li-main"><div class="t">${esc(u.display)} ${u.rol==='admin'?'<span class="chip acc">admin</span>':''}</div><div class="s">${esc(u.username)} · N° ${esc(u.codigo||'')}</div></div><button class="btn ghost sm" data-rol="${u.uid}" data-cur="${u.rol}">${u.rol==='admin'?'Quitar admin':'Hacer admin'}</button></div>`).join(""):'<p class="tiny">Sin usuarios activos.</p>');
    $$("#usersBox [data-appr]").forEach(b=>b.onclick=async()=>{await Store.setUser(b.dataset.appr,{estado:"activo"});toast("Usuario aprobado");});
    $$("#usersBox [data-rol]").forEach(b=>b.onclick=async()=>{await Store.setUser(b.dataset.rol,{rol:b.dataset.cur==='admin'?'user':'admin'});toast("Rol actualizado");});
  });

  // avances list + upload
  Store.subscribeAvances(list=>{const el=$("#avList");if(!el)return;

    $$("#avList [data-dela]").forEach(b=>b.onclick=async()=>{if(confirm("¿Eliminar avance?"))await Store.deleteAvance(b.dataset.dela);});});
  let avFilas=[];
  $("#avFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const st=$("#avStatus");
    if(!c.gemini.apiKey){st.innerHTML=`<div class="ocr-note">⚠️ Configura la API key de Gemini primero.</div>`;return;}
    st.innerHTML=`<div class="ocr-note">🤖 Leyendo…</div>`;
    try{let t=await f.text();if(/\.html?$/i.test(f.name)||/<table|<td/i.test(t))t=htmlATexto(t);
      const data=await leerAvanceLooker(t);
      avFilas=(data.filas||[]).map(x=>({nivel:x.nivel==='departamento'?'departamento':'asesor',nombre:x.nombre||'',
        area:(AREAS.includes((x.area||'').toUpperCase())?x.area.toUpperCase():areaDeDepto((x.departamento||'').toUpperCase())||AREAS[0]),
        departamento:(x.departamento||(x.nivel==='departamento'?x.nombre:''))||'',gext:+x.gext||0,seguro:+x.seguro||0}));
      st.innerHTML=`<div class="ocr-note">${avFilas.length} fila(s). Revisa y guarda.${data.dudas&&data.dudas.length?' Dudas: '+data.dudas.map(esc).join(', '):''}</div>`;drawAv();}
    catch(err){st.innerHTML=`<div class="ocr-note">No pude leer (${esc(err.message)}).</div>`;}};
  function drawAv(){if(!avFilas.length){$("#avTabla").innerHTML="";return;}
    $("#avTabla").innerHTML=`<div class="rep-wrap" style="margin-top:10px"><table><thead><tr><th>Nivel</th><th>Nombre</th><th>Área</th><th>Depto</th><th>Gtía</th><th>Seguro</th><th></th></tr></thead><tbody>${avFilas.map((f,i)=>`<tr>
      <td><select data-i="${i}" data-f="nivel"><option value="asesor" ${f.nivel==='asesor'?'selected':''}>asesor</option><option value="departamento" ${f.nivel==='departamento'?'selected':''}>depto</option></select></td>
      <td><input data-i="${i}" data-f="nombre" value="${esc(f.nombre)}" style="min-width:110px"></td>
      <td><select data-i="${i}" data-f="area">${AREAS.map(a=>`<option ${f.area===a?'selected':''}>${a}</option>`).join("")}</select></td>
      <td><input data-i="${i}" data-f="departamento" value="${esc(f.departamento)}" style="min-width:100px"></td>
      <td><input data-i="${i}" data-f="gext" inputmode="numeric" value="${f.gext}" style="min-width:80px"></td>
      <td><input data-i="${i}" data-f="seguro" inputmode="numeric" value="${f.seguro}" style="min-width:80px"></td>
      <td><button class="icon-btn" data-del="${i}">🗑</button></td></tr>`).join("")}</tbody></table></div>
      <div class="btn-row"><button class="btn" id="avSave">Guardar avance</button></div>`;
    $$("#avTabla [data-i]").forEach(el=>el.onchange=()=>{const f=avFilas[+el.dataset.i],k=el.dataset.f;f[k]=(k==='gext'||k==='seguro')?num(el.value):el.value;});
    $$("#avTabla [data-del]").forEach(b=>b.onclick=()=>{avFilas.splice(+b.dataset.del,1);drawAv();});
    $("#avSave").onclick=async()=>{const btn=$("#avSave");btn.disabled=true;btn.textContent="Guardando…";
      try{await Store.addAvance({fecha:$("#avFecha").value||todayStr(),fuente:"looker",filas:avFilas});toast("Avance guardado ✓");avFilas=[];$("#avTabla").innerHTML="";}
      catch(err){toast("Error: "+err.message);btn.disabled=false;btn.textContent="Guardar avance";}};
  }

  $("#cfgSave").onclick=async()=>{
    c.mes={inicio:$("#cMesIni").value,fin:$("#cMesFin").value};
    $$("#metasBox [data-k]").forEach(inp=>{const k=inp.dataset.k;c.metas[k]=c.metas[k]||{garantia:0,seguro:0};c.metas[k][inp.dataset.t]=num(inp.value);});
    c.gemini.apiKey=$("#cGemKey").value.trim();c.gemini.model=$("#cGemModel").value.trim()||"gemini-2.0-flash";
    c.theme.accent=$("#cAccent").value;
    const jt=$("#fbJson").value.trim();if(jt){try{c.firebase=Object.assign(c.firebase,JSON.parse(jt));}catch{return toast("JSON de Firebase inválido");}}
    await Store.saveConfig(c);applyTheme();toast("Configuración guardada ✓");
    if(c.firebase.apiKey&&c.firebase.projectId&&Store.mode!=="firebase"&&confirm("Firebase configurado. ¿Recargar para conectar?"))location.reload();
  };
}
function bindApariencia(c){
  $("#mDark").onclick=()=>{localStorage.setItem("re_mode","dark");applyTheme();$("#mDark").classList.add("active");$("#mLight").classList.remove("active");};
  $("#mLight").onclick=()=>{localStorage.setItem("re_mode","light");applyTheme();$("#mLight").classList.add("active");$("#mDark").classList.remove("active");};
  $$(".swatch").forEach(s=>s.onclick=async()=>{c.theme.accent=s.dataset.hex;$("#cAccent").value=s.dataset.hex;$$(".swatch").forEach(x=>x.classList.remove("sel"));s.classList.add("sel");applyThemeAccent(s.dataset.hex);if(Store.isAdmin())await Store.saveConfig(c);});
  $("#cAccent").oninput=e=>{c.theme.accent=e.target.value;applyThemeAccent(e.target.value);};
}
function applyThemeAccent(hex){document.documentElement.style.setProperty("--accent",hex);document.documentElement.style.setProperty("--on-accent",lum(hex)>0.6?"#151a08":"#ffffff");}

/* =========================================================================
   Arranque
   ========================================================================= */

  Store.subscribeAvances(()=>{if(CURRENT==="avance")renderAvance($("#app"));});
  render();
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch{}}
})();
</script>
