<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#aad503">
<title>Reporte Electro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0f1210; --bg2:#151a13; --card:#1a2016; --card2:#212a1b; --line:#2c3626;
    --text:#eef2e8; --muted:#a7b39a; --muted2:#717d64;
    --accent:#aad503; --on-accent:#151a08; --input:#0d120b;
    --ok:#4ade80; --okbg:#12240f; --warn:#facc15; --warnbg:#2a2408; --bad:#f87171; --badbg:#2a1210;
    --radius:16px; --shadow:0 10px 28px rgba(0,0,0,.35); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + var(--safe-b));transition:background .2s,color .2s}
  a{color:var(--accent)}
  .app{max-width:820px;margin:0 auto;padding:14px 15px 0} .hidden{display:none!important}

  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 13px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
  .brand img{width:32px;height:32px;border-radius:9px;box-shadow:var(--shadow)}
  .brand small{display:block;color:var(--muted2);font-weight:700;font-size:10px}
  .spacer{flex:1}
  .pill{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)} .dot.online{background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:11px;font-size:15px;cursor:pointer;display:grid;place-items:center;flex:none}
  .icon-btn:hover{border-color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:13px 0;box-shadow:var(--shadow)}
  .card h2{margin:0 0 3px;font-size:17px} .card h3{margin:15px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 12px} .muted{color:var(--muted)} .tiny{font-size:12px;color:var(--muted2)} .center{text-align:center}

  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:600}
  input,select,textarea{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);padding:12px 13px;border-radius:11px;font-size:16px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(max-width:520px){.grid2{grid-template-columns:1fr}}
  .row{display:flex;gap:10px}.row>*{flex:1}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);border:none;padding:13px 15px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;width:100%}
  .btn:active{transform:scale(.985)} .btn:hover{filter:brightness(1.06)}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.dark{background:#20261b;color:#eef2e8;border:1px solid var(--line)}
  .btn.sm{width:auto;padding:9px 12px;font-size:13px;border-radius:10px}
  .btn[disabled]{opacity:.5} .btn-row{display:flex;gap:10px;margin-top:13px}.btn-row .btn{width:auto;flex:1}

  .seg{display:flex;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);padding:10px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer}
  .seg button.active{background:var(--accent);color:var(--on-accent)}

  .chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .chip.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--accent)}
  .chip.warn{background:var(--warnbg);border-color:#5a4a0a;color:var(--warn)}

  .rep-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:13px;background:var(--input)}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{background:var(--card2);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr.area-row td{background:color-mix(in srgb,var(--accent) 12%,var(--card));font-weight:800}
  tbody tr.total td{background:var(--card2);font-weight:800}
  tbody tr.asesor td:first-child{padding-left:20px;color:var(--muted)}

  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi .k{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .k .n{font-size:20px;font-weight:900} .kpi .k .l{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px}

  .sem{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  .sem.ok{background:var(--ok)}.sem.warn{background:var(--warn)}.sem.bad{background:var(--bad)}
  .pctok{color:var(--ok)}.pctwarn{color:var(--warn)}.pctbad{color:var(--bad)}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px calc(8px + var(--safe-b));display:flex;justify-content:space-around}
  .nav button{background:none;border:none;color:var(--muted2);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;cursor:pointer;flex:1;border-radius:10px}
  .nav button .ic{font-size:20px;line-height:1} .nav button.active{color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:120;max-width:90%;text-align:center;font-size:14px}
  .modal-bg{position:fixed;inset:0;background:rgba(3,7,4,.72);z-index:90;display:grid;place-items:center;padding:14px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
  .modal .m-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal .m-body{padding:17px}
  .list-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--input)}
  .list-item .li-main{flex:1;min-width:0}.list-item .li-main .t{font-weight:800}.list-item .li-main .s{font-size:12px;color:var(--muted)}

  .ocr-note{font-size:12px;color:var(--warn);background:var(--warnbg);border:1px solid #5a4a0a;padding:8px 10px;border-radius:10px;margin-top:8px}
  .field-flag{border-color:var(--warn)!important}
  .badge-ai{font-size:10px;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid var(--accent);color:var(--accent);padding:2px 7px;border-radius:999px;margin-left:6px}
  .swatch{width:32px;height:32px;border-radius:9px;border:2px solid transparent;cursor:pointer}.swatch.sel{border-color:var(--text)}
  .fpbadge{display:inline-flex;align-items:center;gap:6px;font-weight:900}
  .fpring{width:22px;height:22px;border-radius:50%;background:conic-gradient(#00a94f 0 25%,#0072ce 0 50%,#e4002b 0 75%,#ff7f00 0 100%);-webkit-mask:radial-gradient(circle 6px,transparent 98%,#000);mask:radial-gradient(circle 6px,transparent 98%,#000)}
  .fplogo{height:30px;width:auto;vertical-align:middle;display:inline-block}

  .fs{position:fixed;inset:0;background:#fff;color:#111;z-index:200;overflow:auto;padding:16px}
  .fs .fs-close{position:fixed;top:12px;right:12px;background:#111;color:#fff;border:none;width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;z-index:210}
  .fs h1{font-size:22px;margin:2px 0 2px;text-align:center}
  .fs .fs-date{text-align:center;color:#555;margin-bottom:6px;text-transform:capitalize}
  .fs .fs-kpis{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
  .fs .fs-kpis .k{background:#f3f6ea;border-radius:10px;padding:8px 12px;text-align:center;min-width:96px}
  .fs .fs-kpis .k .n{font-weight:900;font-size:16px}.fs .fs-kpis .k .l{font-size:10px;color:#666;text-transform:uppercase}
  .fs table{background:#fff;color:#111;border:1px solid #ddd;table-layout:fixed}
  .fs th,.fs td{border-bottom:1px solid #e5e5e5;padding:7px;font-size:12px;overflow:hidden;text-overflow:ellipsis}
  .fs th:first-child,.fs td:first-child{width:26%}
  .fs thead th{background:#f3f6ea;color:#333}
  .fs tr.area-row td{background:#eaf3c6;color:#1a1f14;font-weight:800}
  .fs tr.total td{background:#111;color:#fff;font-weight:900}
  .fs .sem{width:10px;height:10px}
  .fs .fs-foot{text-align:center;color:#888;font-size:12px;margin-top:12px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><img src="icon-180.png" alt="RE"><div>Reporte Electro<small>Garantía · Seguro</small></div></div>
  <div class="spacer"></div>
  <span class="pill" id="updPill"><span class="dot" id="modeDot"></span><span id="updText">—</span></span>
  <button class="icon-btn" id="btnBrush" title="Color de la app">🖌️</button>
  <button class="icon-btn" id="btnTheme" title="Claro/oscuro">🌙</button>
  <button class="icon-btn" id="btnLogout" title="Cerrar sesión">⎋</button>
</div>

<div class="app" id="app"></div>

<nav class="nav" id="nav">
  <button data-view="registrar" class="active"><span class="ic">➕</span>Registrar</button>
  <button data-view="reporte"><span class="ic">📊</span>Reporte</button>
  <button data-view="avance"><span class="ic">📈</span>Avance</button>
  <button data-view="config"><span class="ic">⚙️</span>Config</button>
</nav>

<script>
/* ===================== REPORTE ELECTRO v4 ===================== */
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyB93sG_IutD5EKhbj9ABSpZD490EztJm2M",
  authDomain:"reportecostaneraelectro.firebaseapp.com",
  projectId:"reportecostaneraelectro",
  storageBucket:"reportecostaneraelectro.firebasestorage.app",
  messagingSenderId:"791907095112",
  appId:"1:791907095112:web:49ecbd5dee34764265fe7d"
};

const AREA_EN="ELECTRO NEGRO", AREA_LB="LINEA BLANCA";
const AREAS=[AREA_EN,AREA_LB];
const DEPTOS_EN=["AUDIO","COMPUTACION","CONNECT","VIDEOJUEGOS","FOTOGRAFIA"]; // Electro Negro con departamentos
const DEPTOS_LB=["ELECTRODOMESTICOS","CUIDADO PERSONAL","LINEA BLANCA"];      // Línea Blanca: metas y avance por depto
const SEGURO_DEPTS=new Set(["CONNECT"]); // solo Connect lleva meta de seguro
const NOMIX_DEPTOS=["VIDEO","AUDIO","COMPUTACION Y HOGAR","TELEFONIA","ELECTRODOMESTICOS","LINEA BLANCA","DECO",
  "ZAPATOS HOMBRE","ZAPATOS MUJER","ZAPATILLAS HOMBRE","ZAPATILLAS MUJER","CALZADO COLEGIAL","ZAPATOS INFANTIL"];
const THEME_PRESETS={"Lima":"#aad503","Azul":"#3b82f6","Cian":"#06b6d4","Violeta":"#8b5cf6","Naranjo":"#f97316","Rojo":"#ef4444","Rosa":"#ec4899"};
const ADMIN_PASS="connect2025";

function metaKey(area,dep){return area+"::"+dep;}
function metasSeed(){const m={};DEPTOS_EN.forEach(d=>{m[metaKey(AREA_EN,d)]=SEGURO_DEPTS.has(d)?{garantia:0,seguro:0}:{garantia:0};});DEPTOS_LB.forEach(d=>{m[metaKey(AREA_LB,d)]={garantia:0};});return m;}
const DEFAULT_CONFIG={mes:{inicio:"",fin:""},metas:metasSeed(),theme:{accent:"#aad503"},
  gemini:{apiKey:"",model:"gemini-2.5-flash"},firebase:{apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""}};

/* utils */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const clean=s=>(s||"").toString().trim();
const norm=s=>clean(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const CLP=n=>(n<0?"-$":"$")+Math.abs(Math.round(+n||0)).toLocaleString("es-CL");
const num=v=>Math.round(+String(v).replace(/[^\d-]/g,""))||0;
const JEFES=["isabel de lourd matus","pablo andres hernandez","yesenia yasmin gonzalez","miguel angel moraga"];
const esJefe=nombre=>{const n=norm(nombre);return !!n&&JEFES.some(j=>n.includes(j)||j.includes(n));};
const looknum=s=>{const n=parseInt(String(s||"").replace(/[^\d-]/g,""),10);return isNaN(n)?0:n;};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function fechaLarga(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function fechaHora(ts){const d=new Date(ts);return d.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});}
function toast(m,ms=2600){let t=$(".toast");if(t)t.remove();t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function estado(p){return p>=100?"ok":p>=80?"warn":"bad";}
function diffDays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}

/* tema */
const PAL={dark:{"--bg":"#0f1210","--bg2":"#151a13","--card":"#1a2016","--card2":"#212a1b","--line":"#2c3626","--text":"#eef2e8","--muted":"#a7b39a","--muted2":"#717d64","--input":"#0d120b"},
  light:{"--bg":"#f4f6f0","--bg2":"#eef1e8","--card":"#ffffff","--card2":"#f5f8ef","--line":"#dde3d2","--text":"#1a1f14","--muted":"#5c6650","--muted2":"#8a927c","--input":"#f7f9f2"}};
function lum(h){const c=h.replace("#","");return (0.299*parseInt(c.slice(0,2),16)+0.587*parseInt(c.slice(2,4),16)+0.114*parseInt(c.slice(4,6),16))/255;}
function applyThemeAccent(hex){document.documentElement.style.setProperty("--accent",hex);document.documentElement.style.setProperty("--on-accent",lum(hex)>0.6?"#151a08":"#fff");}
function applyTheme(){const mode=localStorage.getItem("re_mode")||"dark";const accent=(Store.config?.theme?.accent)||"#aad503";
  const r=document.documentElement.style,pal=PAL[mode];for(const k in pal)r.setProperty(k,pal[k]);applyThemeAccent(accent);
  const bt=$("#btnTheme");if(bt)bt.textContent=mode==="dark"?"🌙":"☀️";
  const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.setAttribute("content",pal["--bg"]);}
function toggleTheme(){localStorage.setItem("re_mode",(localStorage.getItem("re_mode")||"dark")==="dark"?"light":"dark");applyTheme();}

/* ===================== Store ===================== */
const Store={mode:"local",db:null,auth:null,storage:null,user:null,config:null,
  ventasCache:[],onVentas:null,avancesCache:[],onAvances:null,usersCache:[],onUsers:null,
  lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},lsSet(k,v){localStorage.setItem(k,JSON.stringify(v))},
  loadLocalConfig(){const c=this.lsGet("re4_config",null);this.config=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)),c||{});
    this.config.metas=Object.assign(metasSeed(),this.config.metas||{});this.config.gemini=Object.assign({},DEFAULT_CONFIG.gemini,this.config.gemini||{});
    this.config.firebase=Object.assign({},DEFAULT_CONFIG.firebase,this.config.firebase||{});this.config.theme=Object.assign({accent:"#aad503"},this.config.theme||{});
    this.config.mes=Object.assign({inicio:"",fin:""},this.config.mes||{});return this.config;},
  async saveConfig(c){this.config=c;this.lsSet("re4_config",c);if(this.mode==="firebase"){try{await this.db.collection("config").doc("app").set(c,{merge:true});}catch(e){toast("No se pudo guardar en línea (¿admin?)");}}},
  async loadRemoteConfig(){if(this.mode!=="firebase")return;try{const d=await this.db.collection("config").doc("app").get();if(d.exists){this.config=Object.assign(this.config,d.data());this.config.metas=Object.assign(metasSeed(),this.config.metas||{});this.lsSet("re4_config",this.config);}}catch(e){}},
  async init(){this.loadLocalConfig();const fc=(FIREBASE_CONFIG.apiKey?FIREBASE_CONFIG:this.config.firebase);
    if(fc&&fc.apiKey&&fc.projectId){try{await this.initFirebase(fc);this.mode="firebase";return;}catch(e){toast("Firebase no conectó, modo local");}}this.mode="local";},
  loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});},
  async initFirebase(fc){if(!window.firebase){const b="https://www.gstatic.com/firebasejs/10.14.1/";for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js","firebase-storage-compat.js"])await this.loadScript(b+f);}
    if(!firebase.apps.length)firebase.initializeApp(fc);this.db=firebase.firestore();this.auth=firebase.auth();try{this.storage=firebase.storage();}catch{this.storage=null;}
    try{const d=await this.db.collection("config").doc("app").get();if(d.exists){this.config=Object.assign(this.config,d.data());this.config.metas=Object.assign(metasSeed(),this.config.metas||{});this.lsSet("re4_config",this.config);}}catch(e){}},
  emailFor(u){return u+"@reporteelectro.app";},
  usernameOf(n,a){return (norm(n)+"."+norm(a)).replace(/[^a-z0-9.]/g,"").replace(/\.+/g,".");},
  async countUsers(){if(this.mode==="firebase"){const s=await this.db.collection("usuarios").limit(1).get();return s.size;}return Object.keys(this.lsGet("re4_users",{})).length;},
  async signUp({nombre,apellido,codigo,clave}){const username=this.usernameOf(nombre,apellido);
    const mkProf=(first)=>({nombre:clean(nombre),apellido:clean(apellido),codigo:clean(codigo),username,display:clean(nombre)+" "+clean(apellido),rol:first?"admin":"user",estado:first?"activo":"pendiente",createdAt:Date.now()});
    if(this.mode==="firebase"){const cred=await this.auth.createUserWithEmailAndPassword(this.emailFor(username),clave);const first=(await this.countUsers())===0;const prof=mkProf(first);prof.uid=cred.user.uid;
      await this.db.collection("usuarios").doc(cred.user.uid).set(prof);if(prof.estado!=="activo")await this.auth.signOut();else this.user=prof;return prof;}
    const first=(await this.countUsers())===0;const prof=mkProf(first);const users=this.lsGet("re4_users",{});if(users[username])throw new Error("Ese usuario ya existe.");prof.uid="local_"+uid();prof.clave=clave;users[username]=prof;this.lsSet("re4_users",users);if(prof.estado==="activo"){this.lsSet("re4_session",prof.uid);this.user=prof;}
    return prof;},
  async signIn({username,clave}){username=norm(username).replace(/\s+/g,".");
    if(this.mode==="firebase"){const cred=await this.auth.signInWithEmailAndPassword(this.emailFor(username),clave);const d=await this.db.collection("usuarios").doc(cred.user.uid).get();const p=d.exists?d.data():null;
      if(!p||p.estado!=="activo"){await this.auth.signOut();throw new Error("Tu cuenta está pendiente de aprobación.");}this.user=p;await this.loadRemoteConfig();return p;}
    const users=this.lsGet("re4_users",{});const u=users[username];if(!u||u.clave!==clave)throw new Error("Usuario o clave incorrectos.");
    if(u.estado!=="activo")throw new Error("Tu cuenta está pendiente de aprobación.");this.lsSet("re4_session",u.uid);this.user=u;return u;},
  async restoreSession(){if(this.mode==="firebase"){return new Promise(res=>{this.auth.onAuthStateChanged(async u=>{if(u){const d=await this.db.collection("usuarios").doc(u.uid).get();const p=d.exists?d.data():null;this.user=(p&&p.estado==="activo")?p:null;if(p&&p.estado!=="activo")await this.auth.signOut();if(this.user)await this.loadRemoteConfig();}else this.user=null;res(this.user);});});}
    const sid=this.lsGet("re4_session",null);if(sid){const users=this.lsGet("re4_users",{});this.user=Object.values(users).find(u=>u.uid===sid)||null;}return this.user;},
  async signOut(){if(this.mode==="firebase")await this.auth.signOut();else localStorage.removeItem("re4_session");this.user=null;},
  isAdmin(){return this.user&&this.user.rol==="admin";},

  _emitU(){this.usersCache=Object.values(this.lsGet("re4_users",{}));if(this.onUsers)this.onUsers(this.usersCache);},
  async setUser(u2,patch){if(this.mode==="firebase")await this.db.collection("usuarios").doc(u2).update(patch);
    else{const users=this.lsGet("re4_users",{});const k=Object.keys(users).find(x=>users[x].uid===u2);if(k){Object.assign(users[k],patch);this.lsSet("re4_users",users);this._emitU();}}
    if(this.user&&this.user.uid===u2)Object.assign(this.user,patch);},
  async deleteUser(u2){if(this.mode==="firebase")await this.db.collection("usuarios").doc(u2).delete();
    else{const users=this.lsGet("re4_users",{});const k=Object.keys(users).find(x=>users[x].uid===u2);if(k){delete users[k];this.lsSet("re4_users",users);this._emitU();}}},
  async claimAdmin(){await this.setUser(this.user.uid,{rol:"admin",estado:"activo"});},
  async addVenta(v){v.registradoPor=this.user.uid;v.registradoPorNombre=this.user.display||"";v.ts=Date.now();
    if(this.mode==="firebase"){const r=await this.db.collection("ventas").add(v);v.id=r.id;}else{v.id=uid();const a=this.lsGet("re4_ventas",[]);a.push(v);this.lsSet("re4_ventas",a);this._emitV();}return v;},
  subscribeVentas(cb){this.onVentas=cb;if(this.mode==="firebase"){this.db.collection("ventas").orderBy("ts","desc").onSnapshot(s=>{this.ventasCache=s.docs.map(d=>Object.assign({id:d.id},d.data()));cb(this.ventasCache);});}else this._emitV();},
  _emitV(){this.ventasCache=this.lsGet("re4_ventas",[]).sort((a,b)=>b.ts-a.ts);if(this.onVentas)this.onVentas(this.ventasCache);},
  async addAvance(a){a.importadoPor=this.user.uid;a.ts=Date.now();
    const ex=this.avancesCache.find(x=>x.fecha===a.fecha);
    if(ex){const merged=Object.assign({},ex,{ts:a.ts,importadoPor:a.importadoPor,fuente:"looker",
      deptos:(a.deptos&&a.deptos.length)?a.deptos:(ex.deptos||[]),
      vendedores:(a.vendedores&&a.vendedores.length)?a.vendedores:(ex.vendedores||[])});
      if(this.mode==="firebase"){await this.db.collection("avances").doc(ex.id).set(merged);}
      else{const arr=this.lsGet("re4_avances",[]);const i=arr.findIndex(x=>x.id===ex.id);merged.id=ex.id;arr[i]=merged;this.lsSet("re4_avances",arr);this._emitA();}
      return merged;}
    if(this.mode==="firebase"){const r=await this.db.collection("avances").add(a);a.id=r.id;}else{a.id=uid();const arr=this.lsGet("re4_avances",[]);arr.push(a);this.lsSet("re4_avances",arr);this._emitA();}return a;},
  async deleteAvance(id){if(this.mode==="firebase")await this.db.collection("avances").doc(id).delete();else{const arr=this.lsGet("re4_avances",[]).filter(x=>x.id!==id);this.lsSet("re4_avances",arr);this._emitA();}},
  subscribeAvances(cb){this.onAvances=cb;if(this.mode==="firebase"){this.db.collection("avances").orderBy("ts","desc").onSnapshot(s=>{this.avancesCache=s.docs.map(d=>Object.assign({id:d.id},d.data()));cb(this.avancesCache);});}else this._emitA();},
  _emitA(){this.avancesCache=this.lsGet("re4_avances",[]).sort((a,b)=>b.ts-a.ts);if(this.onAvances)this.onAvances(this.avancesCache);},
  async uploadBoleta(file){
    if(this.mode==="firebase"&&this.storage){try{const p=`boletas/${this.user.uid}/${Date.now()}`;const r=this.storage.ref().child(p);await r.put(file);return await r.getDownloadURL();}catch(e){/* Storage no activo (plan gratis): sigue al fallback */}}
    // Sin Storage (plan gratis): comprime la imagen y guarda como dataURL en Firestore (< 1MB por doc).
    if(/^image\//.test(file.type))return await comprimirImagen(file);
    if(file.size<=850*1024)return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(file);});
    throw new Error("Archivo muy grande para guardar sin Storage (máx ~850KB si no es imagen)");
  }
};
function comprimirImagen(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error("no se pudo leer la imagen"));
  fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error("imagen inválida"));
    img.onload=()=>{const max=1100;let{width:w,height:h}=img;if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      let q=0.72,url=cv.toDataURL("image/jpeg",q);while(url.length>900*1024&&q>0.35){q-=0.1;url=cv.toDataURL("image/jpeg",q);}
      res(url);};
    img.src=fr.result;};
  fr.readAsDataURL(file);});}

/* ===================== IA (solo boletas) ===================== */
function fileToB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});}
async function leerBoleta(file){const g=Store.config.gemini;if(!g.apiKey)throw new Error("Falta la API key de Gemini (⚙️ Config).");
  const b64=await fileToB64(file);const deptTxt=AREA_EN+": "+DEPTOS_EN.join(", ")+" | "+AREA_LB+" (sin departamentos)";
  const prompt=`Lees una BOLETA de Falabella (Chile), imagen o PDF. Extrae SOLO lo que veas. Devuelve EXCLUSIVAMENTE JSON:
{"vendedor_nombre":string|null,"vendedor_codigo":string|null,"producto":string|null,"monto":number|null,"valor_garantia":number|null,"tipo":"Garantía"|"Seguro"|null,"area":string|null,"departamento":string|null,"confianza":number,"dudas":[string]}
El vendedor viene como "VENDEDOR:<codigo> <APELLIDO>". Montos enteros en pesos. Sugiere area y departamento de: ${deptTxt}. Si no puedes, null y agrégalo a "dudas".`;
  const body=JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:file.type||"image/jpeg",data:b64}}]}],generationConfig:{temperature:0.1,response_mime_type:"application/json"}});
  const cands=[];if(g.model&&!/^gemini-2\.0/.test(g.model))cands.push(g.model);
  ["gemini-flash-latest","gemini-2.5-flash","gemini-2.5-flash-lite","gemini-flash-lite-latest","gemini-2.0-flash-001"].forEach(m=>{if(!cands.includes(m))cands.push(m);});
  let lastErr="";
  for(const model of cands){
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(g.apiKey)}`;
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body});
    if(r.ok){const j=await r.json();const t=j?.candidates?.[0]?.content?.parts?.[0]?.text||"{}";try{return JSON.parse(t);}catch{const m=t.match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):{};}}
    const txt=(await r.text()).slice(0,140);lastErr="Gemini "+r.status+": "+txt;
    if(r.status!==404&&r.status!==400)throw new Error(lastErr); // 404/400 = modelo no disponible: prueba el siguiente
  }
  throw new Error(lastErr||"Ningún modelo de Gemini disponible");}

/* ===================== Parser Looker (sin IA) ===================== */
function mapLookerDept(raw){const u=norm(raw);
  if(u.includes("juego")||u.includes("consola"))return {area:AREA_EN,dep:"VIDEOJUEGOS"};
  if(u.includes("comput"))return {area:AREA_EN,dep:"COMPUTACION"};
  if(u.includes("celular")||u.includes("connect")||u.includes("telefon"))return {area:AREA_EN,dep:"CONNECT"};
  if(u.includes("fotograf"))return {area:AREA_EN,dep:"FOTOGRAFIA"};
  if(u.includes("audio")||u.includes("video"))return {area:AREA_EN,dep:"AUDIO"};
  if(u.includes("cuidado"))return {area:AREA_LB,dep:"CUIDADO PERSONAL"};
  if(u.includes("electrodomest")||u.includes("peque"))return {area:AREA_LB,dep:"ELECTRODOMESTICOS"};
  return {area:AREA_LB,dep:"LINEA BLANCA"}; // linea blanca y otros de línea blanca
}
function parseLookerFiles(texts){const out={deptos:[],vendedores:[]};
  texts.forEach(t=>{let doc;try{doc=new DOMParser().parseFromString(t,"text/html");}catch{return;}
    const table=doc.querySelector("table");if(!table)return;const rows=[...table.querySelectorAll("tr")];if(!rows.length)return;
    const headers=[...rows[0].querySelectorAll("th,td")].map(x=>norm(x.textContent));
    const idx=n=>headers.findIndex(h=>h.includes(n));
    const iG=idx("gext"),iS=idx("seguro"),iVend=idx("vendedor"),iNom=idx("nombre"),iApe=idx("apellido"),iDep=idx("departamento");
    rows.slice(1).forEach(r=>{if(r.classList.contains("total"))return;const cells=[...r.querySelectorAll("td,th")];if(cells.length<2)return;
      const g=looknum(cells[iG]?.textContent),s=looknum(cells[iS]?.textContent);
      if(iVend>=0){const id=clean(cells[iVend]?.textContent);const nom=(clean(cells[iNom]?.textContent)+" "+clean(cells[iApe]?.textContent)).trim();
        if(id&&!/^total/i.test(id)&&(g||s||nom))out.vendedores.push({id,nombre:nom||("Vendedor "+id),gext:g,seguro:s});}
      else if(iDep>=0){const dep=clean(cells[iDep]?.textContent);if(dep&&!/^total/i.test(dep))out.deptos.push(Object.assign({raw:dep,gext:g,seguro:s},mapLookerDept(dep)));}
    });});
  return out;
}

/* ===================== agregación día (ventas registradas) ===================== */
function metaOf(area,dep){const m=Store.config.metas[metaKey(area,dep)]||{};return {gar:+m.garantia||0,seg:+m.seguro||0};}
function metaLB(){return DEPTOS_LB.reduce((s,d)=>s+metaOf(AREA_LB,d).gar,0);} // meta total Línea Blanca (suma de sus deptos)
function mesInfo(){const m=Store.config.mes||{};if(!m.inicio||!m.fin)return null;const diasTot=diffDays(m.inicio,m.fin)+1;const hoy=todayStr();
  const ref=hoy<m.inicio?m.inicio:(hoy>m.fin?m.fin:hoy);const diasRest=Math.max(1,diffDays(ref,m.fin)+1);return {inicio:m.inicio,fin:m.fin,diasTot,diasRest,diasTrans:diasTot-diasRest+1};}
function aggDia(fecha){
  const en={};DEPTOS_EN.forEach(d=>en[d]={gar:0,seg:0,ases:{}});
  const lb={gar:0,seg:0,ases:{}};const nomix={items:[],total:0};const fp={ases:{},total:0};const fpp={ases:{},total:0};
  Store.ventasCache.forEach(v=>{if(v.fecha!==fecha)return;const nm=v.asesorNombre||"(s/n)";const m=+v.monto||0;
    if(v.categoria==="GEXT"||v.categoria==="SEGURO"){const isG=v.categoria==="GEXT";
      if(v.area===AREA_LB){if(isG)lb.gar+=m;else lb.seg+=m;lb.ases[nm]=lb.ases[nm]||{gar:0,seg:0};if(isG)lb.ases[nm].gar+=m;else lb.ases[nm].seg+=m;}
      else if(en[v.departamento]){const c=en[v.departamento];if(isG)c.gar+=m;else c.seg+=m;c.ases[nm]=c.ases[nm]||{gar:0,seg:0};if(isG)c.ases[nm].gar+=m;else c.ases[nm].seg+=m;}}
    else if(v.categoria==="NOMIX"){nomix.items.push({asesor:nm,dep:v.departamento||"",monto:m});nomix.total+=m;}
    else if(v.categoria==="FPUNTOS"){fp.ases[nm]=(fp.ases[nm]||0)+1;fp.total++;}
    else if(v.categoria==="FPUNTOSPESOS"){fpp.ases[nm]=(fpp.ases[nm]||0)+1;fpp.total++;}});
  return {en,lb,nomix,fp,fpp};
}

let repDate=todayStr();
function buildFilas(agg,diasTot){ // filas para tabla y fullscreen
  const filas=[];let tGar=0,tSeg=0,tMetaDia=0;
  const push=(area,dep,label,c,metaMesOv)=>{const meta=metaOf(area,dep);const metaMes=metaMesOv!=null?metaMesOv:(meta.gar+meta.seg);const metaDia=metaMes/diasTot;
    const tot=c.gar+c.seg;const pct=metaDia?Math.round(tot/metaDia*1000)/10:0;const falta=Math.max(0,Math.round(metaDia-tot));
    tGar+=c.gar;tSeg+=c.seg;tMetaDia+=metaDia;
    filas.push({area,label,gar:c.gar,seg:c.seg,metaDia,pct,es:estado(pct),falta,hasMeta:metaDia>0});};
  filas.push({header:AREA_EN});DEPTOS_EN.forEach(d=>push(AREA_EN,d,d,agg.en[d]));
  filas.push({header:AREA_LB});push(AREA_LB,"",AREA_LB,agg.lb,metaLB());
  const tot=tGar+tSeg;const pctT=tMetaDia?Math.round(tot/tMetaDia*1000)/10:0;
  return {filas,tGar,tSeg,tot,tMetaDia,pctT,esT:estado(pctT),faltaT:Math.max(0,Math.round(tMetaDia-tot))};
}

function renderAvance(app){
  const av=Store.avancesCache[0]||null;const mi=mesInfo();const diasRest=mi?mi.diasRest:1;
  if(!av){app.innerHTML=`<div class="card"><h2>Avance</h2><p class="sub">Aún no hay avances. Un administrador sube los HTML de Looker en ⚙️ Config.</p></div>`;return;}
  // combina el último avance con deptos y el último con vendedores (por si se subieron por separado)
  const deptosSrc=(Store.avancesCache.find(a=>a.deptos&&a.deptos.length)||av);
  const vendSrc=(Store.avancesCache.find(a=>a.vendedores&&a.vendedores.length)||av);
  const en={};DEPTOS_EN.forEach(d=>en[d]={gext:0,seguro:0});const lb={};DEPTOS_LB.forEach(d=>lb[d]={gext:0,seguro:0});
  (deptosSrc.deptos||[]).forEach(x=>{if(x.area===AREA_LB){if(lb[x.dep]){lb[x.dep].gext+=x.gext;lb[x.dep].seguro+=x.seguro;}else{lb["LINEA BLANCA"].gext+=x.gext;lb["LINEA BLANCA"].seguro+=x.seguro;}}else if(en[x.dep]){en[x.dep].gext+=x.gext;en[x.dep].seguro+=x.seguro;}});
  let rows="",TG=0,TS=0,TMg=0,TMs=0;
  const push=(area,dep,label,c)=>{const meta=metaOf(area,dep);const seg=SEGURO_DEPTS.has(dep);
    TG+=c.gext;TS+=c.seguro;TMg+=meta.gar;TMs+=meta.seg;
    if(seg){const metaTot=meta.gar+meta.seg;const falta=Math.max(0,metaTot-(c.gext+c.seguro));
      const pctG=meta.gar?Math.round(c.gext/meta.gar*1000)/10:0;const esG=estado(pctG);
      const pctS=meta.seg?Math.round(c.seguro/meta.seg*1000)/10:0;const esS=estado(pctS);
      const cumpl=`<div class="pct${esG}"><span class="sem ${esG}"></span>Gar ${meta.gar?pctG+'%':'—'}</div><div class="pct${esS}" style="margin-top:2px"><span class="sem ${esS}"></span>Seg ${meta.seg?pctS+'%':'—'}</div>`;
      rows+=`<tr><td><b>${label}</b></td><td>${CLP(c.gext)}</td><td>${CLP(c.seguro)}</td><td>${CLP(metaTot)}</td><td>${cumpl}</td><td>${CLP(falta)}</td></tr>`;
    }else{const metaTot=meta.gar;const falta=Math.max(0,metaTot-c.gext);const pct=metaTot?Math.round(c.gext/metaTot*1000)/10:0;const es=estado(pct);
      rows+=`<tr><td><b>${label}</b></td><td>${CLP(c.gext)}</td><td>—</td><td>${CLP(metaTot)}</td><td class="pct${es}">${metaTot?'<span class="sem '+es+'"></span>'+pct+'%':'—'}</td><td>${CLP(falta)}</td></tr>`;}};
  rows+=`<tr class="area-row"><td>${AREA_EN}</td><td>Garantía</td><td>Seguro</td><td>Meta</td><td>Cumpl.</td><td>Falta</td></tr>`;DEPTOS_EN.forEach(d=>push(AREA_EN,d,d,en[d]));
  rows+=`<tr class="area-row"><td>${AREA_LB}</td><td>Garantía</td><td>Seguro</td><td>Meta</td><td>Cumpl.</td><td>Falta</td></tr>`;DEPTOS_LB.forEach(d=>push(AREA_LB,d,d,lb[d]));
  const avT=TG+TS,metaT=TMg+TMs,faltaT=Math.max(0,metaT-avT),mdT=Math.round(faltaT/diasRest);
  const pctMes=metaT?Math.round(avT/metaT*1000)/10:0;const esMes=estado(pctMes);
  const proy=(mi&&mi.diasTrans>0)?Math.round(avT/mi.diasTrans*mi.diasTot):0;
  const pctProy=metaT?Math.round(proy/metaT*1000)/10:0;
  const ases=(vendSrc.vendedores||[]).filter(v=>(v.gext||v.seguro)&&!esJefe(v.nombre)).sort((a,b)=>(b.gext+b.seguro)-(a.gext+a.seguro));
  const asesRows=ases.length?ases.map(v=>`<tr class="asesor"><td>${esc(v.nombre)}</td><td>${CLP(v.gext)}</td><td>${CLP(v.seguro)}</td><td>${CLP(v.gext+v.seguro)}</td></tr>`).join(""):`<tr><td colspan="4" class="center muted" style="padding:16px">Sin desglose por asesor</td></tr>`;
  app.innerHTML=`
  <div class="card"><div class="row" style="align-items:center"><h2 style="flex:1">Avance del mes</h2><span class="chip acc">${mi?mi.diasRest+' días restantes':'configura el mes en ⚙️'}</span></div>
    ${mi?`<p class="sub">Mes comercial ${esc(mi.inicio)} → ${esc(mi.fin)} · van ${mi.diasTrans}/${mi.diasTot} días.</p>`:'<p class="sub">Configura el mes comercial en ⚙️ para el proyectado y la meta diaria.</p>'}
    <div class="kpi">
      <div class="k"><div class="l">Garantía mes</div><div class="n">${CLP(TG)}</div></div>
      <div class="k"><div class="l">Seguro mes</div><div class="n">${CLP(TS)}</div></div>
      <div class="k"><div class="l">Cumplimiento del plan</div><div class="n pct${esMes}">${metaT?pctMes+'%':'—'}</div></div>
      <div class="k"><div class="l">Proyectado al cierre</div><div class="n">${mi?CLP(proy)+(metaT?' · '+pctProy+'%':''):'—'}</div></div>
    </div>
    <p class="tiny" style="margin-top:8px">Falta <b>${CLP(faltaT)}</b> para el plan · meta diaria <b>${CLP(mdT)}</b>.</p></div>
  <div class="card"><h2>Por área · departamento</h2><div class="rep-wrap" style="margin-top:10px"><table><thead><tr><th>Área / Depto</th><th>Garantía</th><th>Seguro</th><th>Meta</th><th>Cumpl.</th><th>Falta</th></tr></thead>
    <tbody>${rows}<tr class="total"><td>TOTAL TIENDA</td><td>${CLP(TG)}</td><td>${CLP(TS)}</td><td>${CLP(metaT)}</td><td class="pct${esMes}">${metaT?pctMes+'%':'—'}</td><td>${CLP(faltaT)}</td></tr></tbody></table></div></div>
  <div class="card"><h2>Venta por asesor</h2><div class="rep-wrap" style="margin-top:10px"><table><thead><tr><th>Asesor</th><th>Garantía</th><th>Seguro</th><th>Total</th></tr></thead><tbody>${asesRows}</tbody></table></div></div>`;
}

/* ===================== CONFIG ===================== */
function renderConfig(app){const c=Store.config;const admin=Store.isAdmin();const mode=localStorage.getItem("re_mode")||"dark";
  let html=`<div class="card"><h2>Apariencia</h2><div class="seg" style="margin-top:8px"><button id="mDark" class="${mode==='dark'?'active':''}">🌙 Oscuro</button><button id="mLight" class="${mode==='light'?'active':''}">☀️ Claro</button></div>
    <h3>Color de la app</h3><div style="display:flex;gap:10px;flex-wrap:wrap">${Object.entries(THEME_PRESETS).map(([n,h])=>`<div class="swatch ${c.theme.accent===h?'sel':''}" data-h="${h}" title="${n}" style="background:${h}"></div>`).join("")}</div>
    <label style="margin-top:12px">Personalizado</label><input type="color" id="cAccent" value="${c.theme.accent}" style="height:44px;padding:4px"></div>`;
  if(!admin){html+=`<div class="card"><h2>Administración</h2><p class="sub">Necesitas cuenta de administrador para metas, usuarios y avances.</p>
    <label>Clave de administrador</label><input id="claimPass" type="password" placeholder="••••••••"><div class="btn-row"><button class="btn" id="claimBtn">Convertirme en administrador</button></div></div>`;
    app.innerHTML=html;bindApar(c);$("#claimBtn").onclick=async()=>{if($("#claimPass").value!==ADMIN_PASS)return toast("Clave incorrecta");await Store.claimAdmin();toast("Ahora eres administrador");renderConfig(app);};return;}
  const mi=mesInfo();
  html+=`<div class="card"><h2>Mes comercial</h2><div class="grid2"><div><label>Inicio</label><input id="cMesIni" type="date" value="${esc(c.mes.inicio||'')}"></div><div><label>Término</label><input id="cMesFin" type="date" value="${esc(c.mes.fin||'')}"></div></div>
    ${mi?`<p class="tiny" style="margin-top:8px">Quedan <b style="color:var(--accent)">${mi.diasRest}</b> día(s) para que termine el mes (van ${mi.diasTrans}/${mi.diasTot}).</p>`:''}</div>
  <div class="card"><h2>Metas</h2><div id="metasBox"></div></div>
  <div class="card"><h2>Usuarios</h2><p class="sub">Aprueba cuentas y designa administradores.</p><div id="usersBox">Cargando…</div></div>
  <div class="card"><h2>Subir avance de Looker</h2><p class="sub">Sube los HTML de Looker (Venta x Vendedor y/o Venta x Departamento). Puedes elegir ambos a la vez. <b>No usa IA.</b></p>
    <label>Fecha del avance</label><input type="date" id="avFecha" value="${todayStr()}">
    <label class="btn secondary" style="cursor:pointer;margin-top:10px">📄 Elegir archivo(s) (.html)<input id="avFile" type="file" accept=".html,.htm,.txt" multiple class="hidden"></label>
    <div id="avStatus"></div><div id="avPrev"></div><div id="avList" style="margin-top:12px"></div></div>
  <div class="card"><h2>Extracción de boletas (IA · Gemini)</h2><label>API key</label><input id="cGemKey" type="password" value="${esc(c.gemini.apiKey||'')}" placeholder="AIza…"><label>Modelo</label><input id="cGemModel" value="${esc(c.gemini.model||'gemini-2.5-flash')}"><p class="tiny">Solo se usa para leer boletas (no para Looker). Gratis en aistudio.google.com/apikey</p></div>
  <div class="btn-row"><button class="btn" id="cfgSave">Guardar configuración</button></div>`;
  app.innerHTML=html;bindApar(c);

  function drawMetas(){const rowEN=d=>{const m=metaOf(AREA_EN,d);const seg=SEGURO_DEPTS.has(d);
    return `<div class="row" style="align-items:center;margin-bottom:6px"><div style="flex:1.1;font-size:13px;font-weight:700">${d}</div>
      <input class="meta-inp" data-k="${metaKey(AREA_EN,d)}" data-t="garantia" inputmode="numeric" value="${CLP(m.gar)}" placeholder="Garantía">
      ${seg?`<input class="meta-inp" data-k="${metaKey(AREA_EN,d)}" data-t="seguro" inputmode="numeric" value="${CLP(m.seg)}" placeholder="Seguro">`:`<div style="flex:1"></div>`}</div>`;};
    const rowLB=d=>{const m=metaOf(AREA_LB,d);return `<div class="row" style="align-items:center;margin-bottom:6px"><div style="flex:1.1;font-size:13px;font-weight:700">${d}</div><input class="meta-inp" data-k="${metaKey(AREA_LB,d)}" data-t="garantia" inputmode="numeric" value="${CLP(m.gar)}" placeholder="Garantía"><div style="flex:1"></div></div>`;};
    $("#metasBox").innerHTML=`<h3>${AREA_EN}</h3>`+DEPTOS_EN.map(rowEN).join("")+`<h3>${AREA_LB}</h3>`+DEPTOS_LB.map(rowLB).join("");
    $$("#metasBox .meta-inp").forEach(inp=>inp.oninput=()=>{const p=inp.selectionStart,old=inp.value;inp.value=CLP(num(inp.value));inp.selectionStart=inp.selectionEnd=Math.max(0,p+(inp.value.length-old.length));});}
  drawMetas();

  Store.subscribeUsers(list=>{const box=$("#usersBox");if(!box)return;const pend=list.filter(u=>u.estado!=="activo"),act=list.filter(u=>u.estado==="activo");
    const delBtn=u=>u.uid===Store.user.uid?'':`<button class="btn ghost sm" data-del="${u.uid}" data-name="${esc(u.display)}">Eliminar</button>`;
    box.innerHTML=(pend.length?`<h3>Pendientes</h3>`+pend.map(u=>`<div class="list-item"><div class="li-main"><div class="t">${esc(u.display)} <span class="chip warn">pendiente</span></div><div class="s">${esc(u.username)} · N° ${esc(u.codigo||'')}</div></div><div class="btn-row" style="margin:0"><button class="btn sm" data-appr="${u.uid}">Aprobar</button>${delBtn(u)}</div></div>`).join(""):'')
      +`<h3>Activos</h3>`+(act.length?act.map(u=>`<div class="list-item"><div class="li-main"><div class="t">${esc(u.display)} ${u.rol==='admin'?'<span class="chip acc">admin</span>':''}</div><div class="s">${esc(u.username)} · N° ${esc(u.codigo||'')}</div></div><div class="btn-row" style="margin:0"><button class="btn ghost sm" data-rol="${u.uid}" data-cur="${u.rol}">${u.rol==='admin'?'Quitar admin':'Hacer admin'}</button>${delBtn(u)}</div></div>`).join(""):'<p class="tiny">Sin usuarios.</p>');
    $$("#usersBox [data-appr]").forEach(b=>b.onclick=async()=>{await Store.setUser(b.dataset.appr,{estado:"activo"});toast("Aprobado");});
    $$("#usersBox [data-rol]").forEach(b=>b.onclick=async()=>{await Store.setUser(b.dataset.rol,{rol:b.dataset.cur==='admin'?'user':'admin'});toast("Rol actualizado");});
    $$("#usersBox [data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Eliminar a "+b.dataset.name+"? (borra su perfil; su acceso de Firebase Auth se elimina aparte en la consola)"))return;try{await Store.deleteUser(b.dataset.del);toast("Usuario eliminado");}catch(err){toast("Error: "+err.message);}});});

  Store.subscribeAvances(list=>{const el=$("#avList");if(!el)return;el.innerHTML=list.length?`<h3>Avances cargados</h3>`+list.slice(0,8).map(a=>`<div class="list-item"><div class="li-main"><div class="t">${esc(a.fecha||'')}</div><div class="s">${(a.deptos||[]).length} depto(s) · ${(a.vendedores||[]).length} asesor(es)</div></div><button class="icon-btn" data-dela="${a.id}">🗑</button></div>`).join(""):'';
    $$("#avList [data-dela]").forEach(b=>b.onclick=async()=>{if(confirm("¿Eliminar avance?"))await Store.deleteAvance(b.dataset.dela);});});

  let parsed=null;
  $("#avFile").onchange=async e=>{const files=[...e.target.files];if(!files.length)return;const st=$("#avStatus");st.innerHTML=`<div class="ocr-note">Leyendo ${files.length} archivo(s)…</div>`;
    try{const texts=await Promise.all(files.map(f=>f.text()));parsed=parseLookerFiles(texts);
      if(!parsed.deptos.length&&!parsed.vendedores.length){st.innerHTML=`<div class="ocr-note">No encontré tablas de Looker en el archivo. ¿Es el HTML descargado de Looker?</div>`;return;}
      st.innerHTML=`<div class="ocr-note">✓ ${parsed.deptos.length} depto(s) y ${parsed.vendedores.length} asesor(es) detectados.</div>`;
      // preview deptos agrupados
      const en={};DEPTOS_EN.forEach(d=>en[d]={g:0,s:0});const lb={g:0,s:0};parsed.deptos.forEach(x=>{if(x.area===AREA_LB){lb.g+=x.gext;lb.s+=x.seguro;}else if(en[x.dep]){en[x.dep].g+=x.gext;en[x.dep].s+=x.seguro;}});
      let pr=DEPTOS_EN.map(d=>`<tr><td>${d}</td><td>${CLP(en[d].g)}</td><td>${CLP(en[d].s)}</td></tr>`).join("")+`<tr><td>${AREA_LB}</td><td>${CLP(lb.g)}</td><td>${CLP(lb.s)}</td></tr>`;
      $("#avPrev").innerHTML=`<div class="rep-wrap" style="margin-top:10px"><table><thead><tr><th>Depto</th><th>GEXT</th><th>Seguro</th></tr></thead><tbody>${pr}</tbody></table></div><div class="btn-row"><button class="btn" id="avSave">Guardar avance</button></div>`;
      $("#avSave").onclick=async()=>{const btn=$("#avSave");btn.disabled=true;btn.textContent="Guardando…";
        try{await Store.addAvance({fecha:$("#avFecha").value||todayStr(),fuente:"looker",deptos:parsed.deptos.map(x=>({area:x.area,dep:x.dep,raw:x.raw,gext:x.gext,seguro:x.seguro})),vendedores:parsed.vendedores});toast("Avance guardado ✓");$("#avPrev").innerHTML="";$("#avStatus").innerHTML="";parsed=null;}
        catch(err){toast("Error: "+err.message);btn.disabled=false;btn.textContent="Guardar avance";}};
    }catch(err){st.innerHTML=`<div class="ocr-note">Error leyendo: ${esc(err.message)}</div>`;}};

  $("#cfgSave").onclick=async()=>{c.mes={inicio:$("#cMesIni").value,fin:$("#cMesFin").value};
    $$("#metasBox [data-k]").forEach(inp=>{const k=inp.dataset.k;c.metas[k]=c.metas[k]||{};c.metas[k][inp.dataset.t]=num(inp.value);});
    c.gemini.apiKey=$("#cGemKey").value.trim();c.gemini.model=$("#cGemModel").value.trim()||"gemini-2.5-flash";c.theme.accent=$("#cAccent").value;
    await Store.saveConfig(c);applyTheme();toast("Configuración guardada ✓");};
}
function bindApar(c){$("#mDark").onclick=()=>{localStorage.setItem("re_mode","dark");applyTheme();renderConfig($("#app"));};
  $("#mLight").onclick=()=>{localStorage.setItem("re_mode","light");applyTheme();renderConfig($("#app"));};
  $$("#app .swatch").forEach(s=>s.onclick=async()=>{c.theme.accent=s.dataset.h;$("#cAccent").value=s.dataset.h;$$("#app .swatch").forEach(x=>x.classList.remove("sel"));s.classList.add("sel");applyThemeAccent(s.dataset.h);Store.lsSet("re4_config",c);if(Store.isAdmin())await Store.saveConfig(c);});
  $("#cAccent").oninput=e=>{c.theme.accent=e.target.value;applyThemeAccent(e.target.value);};}

/* ===================== arranque ===================== */
(async function(){await Store.init();applyTheme();
  await Store.restoreSession();applyTheme();
  Store.subscribeVentas(()=>{updateHeader();if(CURRENT==="reporte")renderReporte($("#app"));});
  Store.subscribeAvances(()=>{updateHeader();if(CURRENT==="avance")renderAvance($("#app"));});
  updateHeader();render();
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch{}}
})();
</script>
</body>
</html>
