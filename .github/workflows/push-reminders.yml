name: Recordatorios push
on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (UTC). El script ajusta a hora de Santiago.
  workflow_dispatch: {}        # permite dispararlo a mano para probar

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: scripts/reminders
        run: npm install --no-audit --no-fund
      - name: Enviar recordatorios
        working-directory: scripts/reminders
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node send.cjs
